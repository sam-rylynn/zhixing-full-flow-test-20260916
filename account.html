<title>正在打开我的资料｜知星</title>
<script>
(function () {
  'use strict';
  var current=new URL(location.href),target=new URL('./profile.html',current),local=location.protocol==='file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  function one(key,pattern){var values=current.searchParams.getAll(key);return values.length===1&&pattern.test(values[0])?values[0]:'';}
  var report=one('report',/^[a-f0-9]{48}$/),chart=one('chart',/^[a-f0-9]{32}$/);
  if(report&&!current.searchParams.has('chart'))target.searchParams.set('report',report);
  if(chart&&!current.searchParams.has('report'))target.searchParams.set('chart',chart);
  ['wechat_bind','return','synastry-page','open'].forEach(function(key){
    var patterns={wechat_bind:/^(success|failed)$/,return:/^synastry$/, 'synastry-page':/^(home|rank|invite|invite-external|invite-internal|gift|connections)$/,open:/^(managed|invitations)$/};
    var value=one(key,patterns[key]);if(value)target.searchParams.set(key,value);
  });
  if(local){
    target.searchParams.set('private-report','1');
    ['api','deep'].forEach(function(key){
      var values=current.searchParams.getAll(key);if(values.length!==1)return;
      try{var endpoint=new URL(values[0]);if(/^https?:$/.test(endpoint.protocol)&&/^(localhost|127\.0\.0\.1|\[::1\])$/.test(endpoint.hostname)&&!endpoint.username&&!endpoint.password&&!endpoint.search&&!endpoint.hash)target.searchParams.set(key,endpoint.href.replace(/\/$/,''));}catch(_){}
    });
    if(target.searchParams.has('deep')&&one('deepMode',/^mock$/))target.searchParams.set('deepMode','mock');
  }
  var anchors={'account-status':'account-status','report-purchase':'report-purchase','order-center':'order-center','member-upgrade':'ask-section',upgrade:'ask-section','delete-account':'delete-account','local-data':'chart-library-title','profile-summary':'chart-library-title','qa-archive':'ask-section'};
  target.hash=anchors[current.hash.slice(1)] || 'account-status';
  // An invitation capability stays in this tab's temporary storage, never a second URL.
  var invitation=new URLSearchParams(current.hash.slice(1)).getAll('invite');
  if(invitation.length===1&&/^[a-f0-9]{64}$/.test(invitation[0])){
    try{sessionStorage.setItem('zx_private_profile_return_v1',JSON.stringify({returnTo:'synastry',page:'invite-external',inviteToken:invitation[0],createdAt:Date.now()}));target.searchParams.set('return','synastry');target.searchParams.set('synastry-page','invite-external');}catch(_){}
  }
  location.replace(target.href);
})();
</script>
